<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"

<body class="container py-4">
<div class="card border-grey p-3 rounded-3 bg-light">

    <header class="row align-items-center g-5">

        <section class="col-12 col-md-4">
            <article class="row justify-content-center">
                <div class="col-auto">
                    <button class="btn"><i class="bi bi-arrow-left-circle"></i></button>
                    <button class="btn"><i class="bi bi-caret-right-square-fill"></i></button>
                    <button class="btn"><i class="bi bi-arrow-right-circle"></i></button>
                </div>
            </article>
            <article class="row justify-content-center align-items-center">
                <div class="col-auto">
                    <button class="btn"><i class="bi bi-volume-down"></i></button>
                </div>
                <div class="col-4">
                    <input type="range" class="form-range" min="1" max="100" value="50">
                </div>
                <div class="col-auto">
                    <button class="btn"><i class="bi bi-volume-up"></i></button>
                </div>
            </article>
        </section>

        <div class="col-12 col-md-4">
            <h3>Nom artiste</h3>
            <p>Titre de la chanson</p>
            <input type="range" class="form-range" min="1" max="100" value="50">
        </div>

        <aside class="col-12 col-md-4">
            <div class="input-group">
                <input type="text" class="form-control" placeholder="Search">
                <button class="btn btn-outline-secondary" type="submit">
                    <i class="bi bi-search"></i>
                </button>
            </div>
        </aside>

    </header>
